name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        elixir:
          [
            "1.6.6",
            "1.7.4",
            "1.8.2",
            "1.9.4",
            "1.10.4",
            "1.11.4",
            "1.12.3",
            "1.13",
            "1.14",
            "1.15",
            "1.16",
            "1.17",
            "1.18",
          ]
    runs-on: ubuntu-latest
    container: elixir:${{ matrix.elixir }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.elixir }}-
      - name: Install Hex
        run: mix local.hex --force
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test
